<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cloud Resume</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      max-width: 800px;
      margin: auto;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    .section {
      margin: 2em 0;
      padding: 1em;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    a {
      display: inline-block;
      margin: 0.5em 0;
      color: #0077cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Cloud Portfolio</h1>

  <div class="section">
    <h2>📄 My Resume</h2>
    <a href="cv_en.pdf" target="_blank">View CV (English)</a><br>
    <a href="cv_fr.pdf" target="_blank">View CV (French)</a>
  </div>

  <div class="section">
    <h2>💻 My Projects</h2>
    <a href="https://github.com/your-username/cloud-resume" target="_blank">Terraform Infrastructure Code</a>
  </div>

  <div class="section">
    <h2>📊 Visitor Stats</h2>
    <p>Total Visits: <span id="visit-count">Loading...</span></p>
  </div>

  <script>
    fetch('https://your-api-id.execute-api.region.amazonaws.com/prod/visits')
      .then(response => response.json())
      .then(data => {
        document.getElementById('visit-count').innerText = data.visits;
      })
      .catch(err => {
        console.error('Error fetching visit count:', err);
        document.getElementById('visit-count').innerText = 'N/A';
      });
  </script>

</body>
</html>
